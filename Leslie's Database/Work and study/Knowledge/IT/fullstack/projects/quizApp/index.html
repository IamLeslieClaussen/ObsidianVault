<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>quizapp</title>
  </head>
  <body>
    <div class="bg-white rounded w-full max-w-150 overflow-hidden relative shadow-2xl p-5">
      <div id="login-screen" class="flex flex-col gap-4"></div>
      <div id="start-screen" class=" flex flex-col items-center gap-4">
        <div>
          <h2 class="text-4xl font-bold text-orange-500">Quiz Time!</h2>
        </div>
        <p class="text-lg">Test your knowledge with these fun questions</p>
        <button id="start-btn" class="bg-amber-600 text-white px-6 py-3 rounded hover:cursor-pointer hover:bg-amber-800">Start Quiz</button>
      </div>
      <div id="quiz-screen" class="flex flex-col items-center justify-center hidden">
        <div>
          <h2 id="ques-header" class="text-lg font-bold">Question header</h2>
        </div>

        <div class="flex justify-between w-full">
          <p>Question <span id="ques-number">1</span> of <span id="max-ques">5</span></p>
          <div><span id="timer" class="text-red-600">00</span></div>
          <p>Score: <span id="score">5</span></p>
        </div>

        <div id="answers-container" class="w-full flex flex-col gap-2 mt-4">
          <!--Answers will be displayed here-->
        </div>

       
          <div id="progress" class="w-full h-4 bg-[#f8f0e5] rounded overflow-hidden mt-4">
            <div id="progress-bar" class="h-full bg-amber-600 "></div>
          </div>
        
      </div>
      <div id="end-screen" class="flex flex-col items-center gap-4 hidden">
        <h1 class="text-3xl font-bold text-orange-500">Quiz Results</h1>
        <div class="text-center bg-[#f5dbbb] p-4 rounded">
          <p>Your final score is: <span id="final-score">5</span> out of <span id="max-score">5</span></p>
          <p id="final-message" class="text-2xl font-bold text-orange-500">final message</p>
        </div>
        <button id="restart-btn" class="bg-amber-600 text-white px-6 py-3 rounded hover:cursor-pointer hover:bg-amber-800">Restart Quiz</button>
      </div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
