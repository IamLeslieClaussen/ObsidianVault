<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>quizapp</title>
  </head>
  <body>
    <div class="bg-white rounded-xl shadow-lg w-full max-w-[600px] overflow-hidden relative flex flex-col items-center text-center ">

      <div id="start-screen" class="hidden" >
        <h1 class="text-[#e86a23] mb-8 text-[2.5rem]">Quiz Time!</h1>
        <p>Test your knowledge with these fun questions.</p>
        <button id="start-btn">Start Quiz</button>
      </div>
      <div id="quiz-screen" class="hidden" >
        <div>
          <h2 id="question-text" class="text-[#e86a23] mb-8 text-[2.5rem]">Question</h2>
          <div>
            <p>
              Question <span id="current-question">1</span> of <span>5</span>
            </p>
            <p>
              Score: <span id="score">0</span>
            </p>

            <div id="answers-container" class="flex flex-col gap-2.5 mb-6.25">
              <!-- Answer buttons will be dynamically added here -->
            </div>

            <div class="h-2.5 bg-green-500 rounded overflow-hidden mt-10">
              <div id="progress" class="h-full bg-red-700 w-0 transition-[width] duration-300 ease-in-out"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="result-screen" class="">
        <h1 class="text-yellow-300 mb-7.5 text-2xl">Quiz Results</h1>
        <div class="bg-red-200 rounded p-5 mb-7.5">
          <p class="text-blue-700 text-[1rem] mb-4">Your final score is: <span id="final-score">0</span> out of <span id="max-score">5</span></p>

          <div id="result-message" class="text-4xl font-bold text-yellow-700">Good Job</div>
        </div>

        <button id="restart-btn" class="bg-pink-400 text-white rounded px-3.5 py-4">Restart Quiz</button>
      </div>

    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
